name: evals

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-checks:
    name: offline checks
    runs-on: ubuntu-latest
    steps:
      # The course's reference patches are Git LFS pointers whose content was never
      # pushed to this repository, so an LFS checkout would fail on them.
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      # Six Module 2 tests copy analysis/state/ and expect the course's demo labels and
      # splits; this repository's HW4 and HW5 work replaced that state, so they cannot
      # pass here and say nothing about HW6. They still run locally.
      - name: Run checks that do not call a model
        run: >-
          uv run pytest tests/eval tests/test_cli.py tests/test_db.py tests/test_hw_holes.py
          tests/test_harbor_adapter.py tests/test_replay_harness.py -q
          --deselect tests/test_hw_holes.py::test_m2_split_labels_produces_disjoint_stratified_splits
          --deselect tests/test_hw_holes.py::test_m2_test_split_locked_until_frozen
          --deselect tests/test_hw_holes.py::test_m2_label_flip_is_append_only
          --deselect tests/test_hw_holes.py::test_m2_corrected_prevalence_reproduces_artifact_g
          --deselect tests/test_hw_holes.py::test_m2_judge_alignment_matches_artifact_f
          --deselect tests/test_hw_holes.py::test_m2_run_judge_persists_store_predictions_for_prevalence

  complete-evaluations:
    name: Harbor evaluations
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CARTWHEEL_MODEL: ${{ vars.CARTWHEEL_MODEL }}
      PYTHONPATH: ${{ github.workspace }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      # The course's reference patches are Git LFS pointers whose content was never
      # pushed to this repository, so an LFS checkout would fail on them.
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      - name: Install Harbor
        run: |
          uv tool install 'harbor==0.23.0'
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: Generate the classified Harbor tasks
        run: uv run python scripts/export_harbor_tasks.py

      # The provider key reaches the containers through this job's env block:
      # the Cartwheel agent adapter forwards only its model's key to the agent
      # container, and each task's [verifier.env] forwards the judge's key.
      - name: Run every case five times in fresh Docker containers
        run: |
          harbor run \
            -p .harbor/tasks \
            -a harbor_adapter.agent:CartwheelAgent \
            -m "$CARTWHEEL_MODEL" \
            -e docker \
            --n-attempts 5 \
            --job-name hw6-evals \
            --jobs-dir .harbor/jobs \
            --yes

      # Harbor exits 0 even when cases fail; this step applies the CI rule and
      # fails the job when any run of a regression case fails. It runs even if
      # the Harbor step broke, so infrastructure problems are reported too.
      - name: Summarize the cases and apply the CI rule
        if: always()
        run: uv run python scripts/summarize_harbor_job.py .harbor/jobs/hw6-evals --expected-attempts 5

      # Uploaded even when the job fails, so a failed regression keeps its evidence.
      - name: Upload the Harbor job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw6-evals
          path: .harbor/jobs/hw6-evals
          if-no-files-found: warn
