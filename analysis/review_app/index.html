<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartwheel trace review</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23539bf5'/%3E%3C/svg%3E">
<!--
  Homework 4: open coding, taxonomy, structured labels, progress. Built on the Homework 3 review page
  (analysis/ui/pilot_review.html) and the instructor's error-discovery reference (analysis/ui/index.html).
  Reads   GET /api/samples GET /api/annotations GET /api/patterns GET /api/suggestions GET /api/labels GET /api/index GET /api/manifest
  Writes  POST /api/annotations (autosaved)   POST /api/suggestions (accept / dismiss)   POST /api/labels (one decision per call)
  Serve:  uv run python -m analysis.review_app.server
  Records
    inline     the open codes: {id, kind:'inline', trace_id, session_id, scenario_id, batch, turn, turn_trace_id,
               block, start, end, quote, note, ts, source:'human'|'accepted_suggestion', mode?, suggestion_id?}
               `block` is the index of the message the selection sits in and `start`/`end` are character offsets
               inside that block, so a repeated phrase anchors to the right occurrence and a selection crossing
               bold text or a table cell still highlights. block is null for a selection spanning two blocks
               (offsets are then conversation-wide) and for a note with no anchor at all, e.g. a tool call that
               never happened; both fall back to a first-occurrence quote match. `turn_trace_id` is the Langfuse
               trace of the turn the note sits in, which is not the conversation's trace id after the first turn.
               Editing a note rewrites its text and timestamp; deleting removes the record. The handout's
               "keep the original open code in the saved history" is about axial coding, i.e. a note must not be
               replaced by the category it feeds, and that holds because modes live in patterns.json and cite
               notes by id. Deleting a note a mode cites would break that link, so it asks first.
    open_code  one per trace, flags only: {id:'oc-'+scenario_id, kind, trace_id, session_id, scenario_id, batch, no_failure, scenario_issue, scenario_issue_note, ts}
  A trace counts as reviewed when it has an open code with text or the no-failure mark. Nothing is inferred from silence:
  an unreviewed trace stays grey, an undecided label cell stays empty, and a suggestion counts only after an explicit accept.
-->
<style>
  /* GitHub dark dimmed */
  :root {
    --bg: #22272e; --panel: #2d333b; --panel-2: #373e47; --line: #444c56;
    --fg: #adbac7; --fg-muted: #768390; --fg-strong: #cdd9e5;
    --blue: #539bf5; --green: #57ab5a; --red: #e5534b; --yellow: #c69026; --purple: #986ee2; --orange: #cc6b2c;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 var(--sans); }
  a { color: var(--blue); text-decoration: none; } a:hover { text-decoration: underline; }
  button { font: inherit; color: var(--fg-strong); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  button:hover { background: #444c56; } button:disabled { opacity: .4; cursor: default; }
  code, pre { font-family: var(--mono); font-size: 14px; }

  /* top bar */
  .topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .nav { display: flex; align-items: center; gap: 8px; }
  .nav .counter { font-family: var(--mono); font-size: 15px; color: var(--fg-strong); min-width: 10ch; white-space: nowrap; text-align: center; }
  .dots { display: flex; gap: 3px; flex-wrap: wrap; margin-left: auto; max-width: 46vw; align-items: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); cursor: pointer; border: 1px solid transparent; opacity: .4; transition: opacity .25s; }
  .dot.seen, .dot.current { opacity: 1; }
  .dot.fail { background: var(--red); } .dot.pass { background: var(--green); } .dot.issue { background: var(--orange); }
  /* label-focus batches: the dot shows the one label, in a dimmed shade so it reads apart from HW4's open-code colours */
  .dot.lpresent { background: color-mix(in srgb, var(--red) 50%, var(--bg)); opacity: 1; } .dot.labsent { background: color-mix(in srgb, var(--green) 50%, var(--bg)); opacity: 1; }
  .dot.pending { box-shadow: 0 0 0 2px var(--blue); }
  /* Awaiting a decision, same blue ring as a pending suggestion: from the
     reviewer's side both mean the same thing, and the card says which. */
  .dot.cneg, .dot.ppos { box-shadow: 0 0 0 2px var(--blue); }
  /* HW5: the selected judge disagrees with the human label on this trace */
  .dot.jdis { box-shadow: 0 0 0 2px var(--orange); }
  /* Spotlight (analysis/review_app/spotlight.json): while it exists, every other ring is hidden and only these traces carry a ring. Delete the file to restore. */
  .dot.spot { box-shadow: 0 0 0 2.5px var(--blue); opacity: 1; }
  .dot.spotpool { outline: 1.5px dashed var(--blue); outline-offset: 1.5px; opacity: 1; }
  .spotcard { border-color: var(--blue); }
  mark.sp { background: rgba(83,155,245,.22); color: inherit; border-bottom: 2px solid var(--blue); border-radius: 2px; padding: 0 1px; }
  .spotcard .why, .spotcard .concern { font-size: 13.5px; line-height: 1.5; }
  .spotcard .why { color: var(--fg-muted); margin-bottom: 10px; }
  .spotcard .concern { border-left: 2px solid var(--blue); padding-left: 10px; margin: 8px 0 10px; }
  .spotcard .labs { display: grid; grid-template-columns: auto auto; gap: 2px 12px; font-size: 12.5px; font-family: var(--mono); margin-top: 6px; }
  .spotcard .labs .present { color: var(--red); font-weight: 600; } .spotcard .labs .absent { color: var(--green); } .spotcard .labs .none { color: var(--fg-muted); }
  .spotcard .slist a { color: var(--blue); cursor: pointer; margin-right: 8px; font-family: var(--mono); font-size: 12.5px; white-space: nowrap; display: inline-block; }
  .spotcard .slist a.cur { color: var(--fg-strong); text-decoration: underline; }
  .jcard .jrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; font-size: 13.5px; }
  .jcard .v { font-weight: 600; } .jcard .v.pass { color: var(--green); } .jcard .v.fail { color: var(--red); }
  .jcard .agree { color: var(--green); } .jcard .dis { color: var(--orange); font-weight: 600; }
  .jcard .crit { font-size: 13.5px; line-height: 1.5; color: var(--fg); white-space: pre-wrap; border-left: 2px solid var(--line); padding-left: 10px; margin: 6px 0 10px; }
  .jcard .crit.gate { color: var(--fg-muted); font-style: italic; }
  .jcard select { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; font-size: 12.5px; padding: 1px 4px; }
  .jcard .dlist a { color: var(--blue); cursor: pointer; margin-right: 8px; font-family: var(--mono); font-size: 12.5px; white-space: nowrap; display: inline-block; }
  .jcard h2 .tgl, .jcard h2 select { text-transform: none; letter-spacing: 0; font-family: var(--mono); font-size: 12px; white-space: nowrap; }
  .jcard .dlist a.cur { color: var(--fg-strong); text-decoration: underline; }
  tr.lreviewed td { opacity: .62; }
  .mode li.cn.pp { border-left: 3px solid var(--orange); padding-left: 8px; }
  .dot.current { border-color: var(--fg-strong); transform: scale(1.35); }
  /* batch separator: a capsule 1px taller than a dot at each end, spaced by the same flex gap as the dots */
  .dots .gap { width: 1.5px; height: 11px; flex: none; border-radius: 1px; background: var(--line); opacity: .75; }
  .status { font-size: 13.5px; color: var(--fg-muted); min-width: 110px; text-align: right; }
  .tabs { display: flex; gap: 2px; }
  .tabs button { background: transparent; border-color: transparent; color: var(--fg-muted); padding: 4px 10px; }
  .tabs button.on { background: var(--bg); color: var(--fg-strong); border-color: var(--line); }
  .tabs button:hover { background: var(--bg); }

  /* trace header */
  .trace-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--bg); }
  .trace-head .sid { font-family: var(--mono); font-size: 17px; color: var(--fg-strong); font-weight: 600; }
  .chip { display: inline-block; font-size: 12.5px; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--fg); background: var(--panel); }
  .chip.coverage { border-color: var(--blue); color: var(--blue); } .chip.challenge { border-color: var(--orange); color: var(--orange); }
  .chip.dq { border-color: var(--red); color: var(--red); }
  .chip.role { border-color: var(--fg-muted); color: var(--fg-strong); text-transform: capitalize; }
  .chip.flag { border-color: var(--yellow); color: var(--yellow); }
  .chip.final { border-color: var(--green); color: var(--green); } .chip.candidate { border-color: var(--yellow); color: var(--yellow); }
  .chip.rejected, .chip.merged { border-color: var(--fg-muted); color: var(--fg-muted); text-decoration: line-through; }
  .chip.batch { border-color: var(--purple); color: var(--purple); }
  .meta { color: var(--fg-muted); font-size: 14px; } .meta b { color: var(--fg); font-weight: 500; }

  /* body layout */
  .main { display: flex; gap: 20px; padding: 18px 20px 60px; align-items: flex-start; }
  .conv { flex: 1; min-width: 0; max-width: 880px; position: relative; }
  .side { width: 390px; flex: none; position: sticky; top: 62px; display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 76px); overflow-y: auto; }
  .page { padding: 18px 20px 60px; max-width: 1240px; }

  /* message blocks */
  .msg { border: 1px solid var(--line); border-left-width: 4px; border-radius: 6px; background: var(--panel); padding: 8px 12px; margin-bottom: 10px; white-space: pre-wrap; word-break: break-word; }
  .msg .role { display: block; font-size: 12.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 4px; }
  .msg ul { margin: 2px 0 2px 18px; padding: 0; white-space: normal; } .msg li { margin: 1px 0; }
  .msg b { color: var(--fg-strong); } .msg code { background: var(--bg); padding: 1px 4px; border-radius: 3px; }
  .msg table { border-collapse: collapse; margin: 6px 0; white-space: normal; font-size: 14px; }
  .msg th, .msg td { border: 1px solid var(--line); padding: 3px 8px; text-align: left; vertical-align: top; }
  .msg th { background: var(--panel-2); color: var(--fg-strong); }
  .msg.user { border-left-color: var(--blue); } .msg.user .role { color: var(--blue); }
  .msg.assistant { border-left-color: var(--green); } .msg.assistant .role { color: var(--green); }
  .msg.observation { border-left-color: var(--fg-muted); color: var(--fg-muted); } .msg.observation .role { color: var(--fg-muted); }
  /* one step = the agent's narration plus the tool calls it made, nested under the turn with a thin rail;
     narration keeps full opacity but loses its card so the user message and the reply stay the loudest blocks */
  .step { margin: 0 0 18px 24px; padding: 0 0 0 14px; border-left: 2px solid var(--line); }
  .step .msg.assistant { border: 0; border-radius: 0; background: transparent; padding: 0 0 6px; margin-bottom: 0; }
  .step .msg.assistant .role::after { content: " · narration"; color: var(--fg-muted); font-weight: 400; letter-spacing: 0; text-transform: none; }
  .step .tool { margin-bottom: 8px; }
  .step .tool:last-child { margin-bottom: 0; }
  .msg.reply { border-left-width: 6px; margin-top: 26px; }
  .msg.reply .role::after { content: " · reply"; color: var(--fg-muted); font-weight: 400; letter-spacing: 0; text-transform: none; }
  .turn { display: flex; align-items: center; gap: 10px; margin: 18px 0 10px; color: var(--fg-muted); font-size: 13px; }
  .turn::before, .turn::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  .turn code { background: var(--panel); padding: 1px 6px; border-radius: 4px; }

  /* tool cards: the whole card toggles its result; arguments stay visible */
  .tool { border: 1px solid var(--line); border-left: 4px solid var(--purple); border-radius: 6px; background: var(--panel); margin-bottom: 10px; overflow: hidden; cursor: pointer; }
  .tool:hover { border-color: #566271; border-left-color: var(--purple); }
  .tool.err { border-left-color: var(--red); }
  .tool .thead { display: flex; align-items: center; gap: 8px; padding: 7px 12px; background: var(--panel-2); font-family: var(--mono); font-size: 14px; color: var(--fg-strong); user-select: none; }
  .tool .thead .tname { user-select: text; cursor: text; }   /* the call itself is evidence, e.g. "the agent called escalate_to_human" */
  .tool .thead .tag { color: var(--purple); font-weight: 700; font-family: var(--sans); font-size: 12.5px; letter-spacing: .04em; }
  .tool.err .thead .tag { color: var(--red); }
  .tool .thead .sum { margin-left: auto; color: var(--fg-muted); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; }
  .tool .thead .sum .ok { color: var(--green); } .tool .thead .sum .err { color: var(--red); }
  .tool .thead::after { content: "▸"; color: var(--fg-muted); font-family: var(--sans); margin-left: 6px; }
  .tool.open .thead::after { content: "▾"; }
  .tool pre { margin: 0; padding: 8px 12px; overflow-x: auto; color: var(--fg); cursor: text; }
  .tool pre.result, .tool .rbody { display: none; border-top: 1px solid var(--line); }
  .tool.open pre.result, .tool.open .rbody { display: block; }
  .tool .rbody { padding: 8px 12px; cursor: text; white-space: pre-wrap; word-break: break-word; }
  .tool .rres { padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .tool .rres:last-child { border-bottom: 0; }
  .tool .rres .pid { font-family: var(--mono); color: var(--fg-strong); } .tool .rres .score { color: var(--fg-muted); font-size: 13px; margin-left: 8px; }
  .tool .rres .snip { color: var(--fg-muted); font-size: 13.5px; }
  .tool .rbody h4 { margin: 0 0 6px; color: var(--fg-strong); font-size: 15px; }
  .tools-ctl { margin-left: auto; display: flex; gap: 6px; } .tools-ctl button { padding: 3px 10px; font-size: 13.5px; }
  .empty { padding: 60px 20px; text-align: center; color: var(--fg-muted); }
  .empty code { background: var(--panel); padding: 2px 6px; border-radius: 4px; }

  /* inline annotation: highlight in the conversation, floating add button */
  mark.hl { background: rgba(198,144,38,.28); color: inherit; border-bottom: 2px solid var(--yellow); border-radius: 2px; padding: 0 1px; }
  mark.hl.focus { background: rgba(198,144,38,.5); }
  mark.sg { background: rgba(83,155,245,.16); color: inherit; border-bottom: 2px dashed var(--blue); border-radius: 2px; padding: 0 1px; }
  mark.sg.focus { background: rgba(83,155,245,.38); }
  .fab { position: absolute; z-index: 4; background: var(--yellow); color: #1c2128; border: 0; border-radius: 6px; padding: 3px 10px; font-size: 13.5px; font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,.4); display: none; }
  .fab:hover { background: #d9a13a; }

  /* side cards */
  .card { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); flex: none; }
  .card h2 { margin: 0; padding: 9px 12px; font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-muted); border-bottom: 1px solid var(--line); background: var(--panel-2); border-radius: 6px 6px 0 0; display: flex; align-items: center; gap: 8px; }
  .card h2 .sub { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--fg-muted); }
  .card h2 .tgl { margin-left: auto; color: var(--fg-muted); font-weight: 400; cursor: pointer; }
  .card.collapsed .body { display: none; } .card.collapsed h2 { border-bottom: 0; border-radius: 6px; }
  .card h2.clickable { cursor: pointer; }
  .card .body { padding: 10px 12px; }
  .kv { display: grid; grid-template-columns: 104px 1fr; gap: 5px 8px; font-size: 14px; }
  .kv .k { color: var(--fg-muted); } .kv .v { color: var(--fg-strong); word-break: break-word; }
  .kv .v code { background: var(--bg); padding: 1px 5px; border-radius: 4px; }
  .outcome { font-family: var(--mono); font-size: 15px; color: var(--yellow); font-weight: 600; margin-bottom: 6px; word-break: break-word; }
  .criterion { color: var(--fg-strong); margin-bottom: 6px; }
  textarea, input[type=text] { width: 100%; background: var(--bg); color: var(--fg-strong); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: inherit; resize: vertical; }
  textarea:focus, input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(83,155,245,.25); }
  .field { margin-bottom: 10px; } .field label.lbl { display: block; font-size: 13.5px; color: var(--fg-muted); margin-bottom: 4px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: var(--bg); color: var(--fg-muted); padding: 4px 12px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on.yes { background: #1f4a25; color: #6bd07a; } .seg button.on.no { background: #4d1f1c; color: #ff8a80; } .seg button.on.warn { background: #4a3413; color: #f0a24a; }
  .saved { font-size: 13.5px; color: var(--fg-muted); } .saved.dirty { color: var(--yellow); } .saved.ok { color: var(--green); }
  .hint { font-size: 13px; color: var(--fg-muted); margin-top: 6px; }
  kbd { font-family: var(--mono); font-size: 12.5px; background: var(--bg); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--fg); }

  /* inline annotation cards (human: yellow) and agent suggestion cards (dashed blue) */
  .note { border: 1px solid var(--line); border-left: 4px solid var(--yellow); border-radius: 6px; background: var(--panel); flex: none; }
  .note .quote { padding: 8px 12px 6px; font-size: 13.5px; color: var(--fg-muted); font-style: italic; border-bottom: 1px dashed var(--line); cursor: pointer; display: flex; gap: 8px; align-items: flex-start; }
  .note .quote:hover { color: var(--fg); }
  .note .quote .q { flex: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .note .del { flex: none; background: transparent; border: 0; color: var(--fg-muted); padding: 0 2px; font-size: 16px; line-height: 1; }
  .note .del:hover { color: var(--red); background: transparent; }
  .note textarea { border: 0; border-radius: 0 0 6px 6px; background: var(--panel); min-height: 58px; padding: 8px 12px; }
  .note textarea:focus { box-shadow: none; background: var(--bg); }
  .note .origin { font-size: 12.5px; color: var(--fg-muted); padding: 4px 12px 0; font-style: normal; }
  .note .origin code { background: var(--bg); padding: 0 5px; border-radius: 4px; color: var(--blue); }
  .sugg { border: 1px dashed var(--blue); border-left: 4px solid var(--blue); border-radius: 6px; background: rgba(83,155,245,.06); flex: none; }
  .sugg .shead { display: flex; align-items: center; gap: 8px; padding: 7px 12px 4px; font-size: 12.5px; color: var(--blue); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .sugg .shead .m { font-family: var(--mono); text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--fg-strong); }
  .sugg .shead .how { margin-left: auto; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--fg-muted); }
  .sugg .quote { padding: 2px 12px 6px; font-size: 13.5px; color: var(--fg); font-style: italic; cursor: pointer; }
  .sugg .why { padding: 0 12px 8px; font-size: 13.5px; color: var(--fg-muted); }
  .sugg .acts { display: flex; gap: 6px; padding: 0 12px 10px; align-items: center; flex-wrap: wrap; }
  .sugg .acts button { padding: 3px 10px; font-size: 13.5px; }
  .sugg .acts button.acc { border-color: var(--green); color: #6bd07a; } .sugg .acts button.dis { border-color: var(--red); color: #ff8a80; }
  .sugg .acts input { flex: 1; min-width: 120px; padding: 4px 8px; font-size: 13.5px; }
  .sugg.decided { opacity: .6; border-style: solid; }
  .sugg .decision { padding: 0 12px 8px; font-size: 13px; color: var(--fg-muted); }
  .sugg .decision b { color: var(--fg); font-weight: 500; }
  .side h3 { margin: 4px 0 -6px; font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-muted); }

  /* labels strip (review view) and labels grid */
  .lrow { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
  .lrow:last-child { border-bottom: 0; }
  .lrow .m { font-family: var(--mono); color: var(--fg-strong); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .lrow .seg button { padding: 2px 10px; font-size: 13px; }
  table.grid { border-collapse: separate; border-spacing: 0; font-size: 14px; width: 100%; }
  table.grid th, table.grid td { border-bottom: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: middle; white-space: nowrap; }
  table.grid th { position: sticky; top: 50px; background: var(--panel); color: var(--fg-strong); font-weight: 600; z-index: 2; }
  table.grid th.m { font-family: var(--mono); font-weight: 500; font-size: 13px; }
  table.grid td.sid { font-family: var(--mono); color: var(--fg-strong); cursor: pointer; } table.grid td.sid:hover { color: var(--blue); }
  table.grid tr.unreviewed td { color: var(--fg-muted); }
  table.grid td.cell { text-align: center; cursor: pointer; width: 1%; }
  .cell span { display: inline-block; min-width: 28px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); color: var(--fg-muted); font-family: var(--mono); font-size: 13px; }
  .cell span.present { background: #4d1f1c; color: #ff8a80; border-color: #6b2a25; } .cell span.absent { background: #1f4a25; color: #6bd07a; border-color: #2c5f31; }
  .cell.cursor span { outline: 2px solid var(--blue); }

  table.plain th { color: var(--fg-strong); font-weight: 600; } table.plain td.n { text-align: right; font-family: var(--mono); }
  table.plain td .sid { font-family: var(--mono); color: var(--blue); cursor: pointer; }
  .page h2 { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-muted); margin: 22px 0 8px; }

  .cols { display: flex; gap: 40px; flex-wrap: wrap; align-items: flex-start; }
  /* progress page: summary tiles, then cards in a grid */

  .card .body.flush { padding: 0; overflow-x: auto; }

</style>
</head>
<body>
<div class="topbar">
  <div class="tabs" id="tabs">
    <button data-view="review" class="on">Review</button>
    <button data-view="taxonomy">Taxonomy</button>
    <button data-view="labels">Labels</button>
    <button data-view="progress">Progress</button>
  </div>
  <div class="nav" id="nav">
    <button id="prev" title="previous (←)">◀</button>
    <span class="counter" id="counter">– / –</span>
    <button id="next" title="next (→)">▶</button>
  </div>
  <div class="dots" id="dots"></div>
  <div class="status" id="status">loading…</div>
</div>
<div class="trace-head" id="trace-head"></div>
<div class="main" id="main"></div>
<button class="fab" id="fab" title="annotate the selected text">＋ annotate</button>
<div class="toast" id="toast"></div>

<script>
const state = { view: 'review', spotlight: null, judges: [], judgeId: null, samples: [], annotations: [], patterns: { modes: [] }, suggestions: [], labels: {}, index: [], manifest: {},
                idx: 0, saveTimer: null, dirty: false, pendingSel: null, cursor: { row: 0, col: 0 }, snap: {}, p90: { tools: Infinity, reply: Infinity },
                openTools: new Set(), openFor: null, openModes: new Set() };
const api = {
  async get(p) { const r = await fetch(p); return r.json(); },
  async post(p, body) { const r = await fetch(p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); return r.json(); },
};
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pretty = (v) => { if (typeof v === 'string') { try { v = JSON.parse(v); } catch { return v; } } return JSON.stringify(v, null, 2); };
const asObj = (v) => { if (typeof v === 'string') { try { return JSON.parse(v); } catch { return null; } } return v && typeof v === 'object' ? v : null; };
const asList = (a) => Array.isArray(a) ? a : (a && Array.isArray(a.annotations)) ? a.annotations : [];
const now = () => new Date().toISOString();
const pct = (n, d) => d ? `${Math.round(100 * n / d)}%` : '–';
/* Minimal, escape-first markdown for agent replies and policy bodies: **bold**, `code`, "- " bullets, pipe tables, # headings. */
function mdLite(text) {
  const lines = esc(text).split('\n'); const out = []; let inList = false; let table = null;
  const flushTable = () => { if (!table) return; out.push('<table>' + table.map((r, i) => `<tr>${r.map(c => i === 0 ? `<th>${c}</th>` : `<td>${c}</td>`).join('')}</tr>`).join('') + '</table>'); table = null; };
  for (const raw of lines) {
    if (/^\s*\|.*\|\s*$/.test(raw)) {
      const cells = raw.trim().slice(1, -1).split('|').map(c => c.trim().replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'));
      if (cells.every(c => /^:?-{2,}:?$/.test(c))) continue;
      (table = table || []).push(cells); continue;
    }
    flushTable();
    let line = raw.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
    const h = line.match(/^\s*#{1,3}\s+(.*)$/); if (h) line = `<b>${h[1]}</b>`;
    const li = line.match(/^\s*[-*]\s+(.*)$/);
    if (li) { if (!inList) { out.push('<ul>'); inList = true; } out.push(`<li>${li[1]}</li>`); continue; }
    if (inList) { out.push('</ul>'); inList = false; }
    out.push(line);
  }
  if (inList) out.push('</ul>');
  flushTable();
  return out.join('\n').replace(/\n(<\/?ul>|<li>|<table>)/g, '$1').replace(/(<\/li>|<ul>|<\/ul>|<\/table>)\n/g, '$1');
}

/* ---------- data ---------- */
async function load() {
  const [samples, annotations, patterns, suggestions, labels, index, manifest, judges] = await Promise.all(
    ['/api/samples', '/api/annotations', '/api/patterns', '/api/suggestions', '/api/labels', '/api/index', '/api/manifest', '/api/judges'].map(api.get));
  state.judges = Array.isArray(judges) ? judges : [];
  state.samples = Array.isArray(samples) ? samples : [];
  state.annotations = asList(annotations);
  state.patterns = patterns && Array.isArray(patterns.modes) ? patterns : { modes: [] };
  state.suggestions = Array.isArray(suggestions) ? suggestions : [];
  state.labels = labels && typeof labels === 'object' ? labels : {};
  state.index = Array.isArray(index) ? index : [];
  state.manifest = manifest && typeof manifest === 'object' ? manifest : {};
  state.snap = { samples: JSON.stringify(samples), patterns: JSON.stringify(patterns), suggestions: JSON.stringify(suggestions) };
  // Restore the browser backup only when the last edit never reached the server (the dirty flag survives a reload).
  // A backup must never overwrite a deliberately reset or switched state file.
  try { const backup = JSON.parse(localStorage.getItem('cartwheel_hw4_annotations') || 'null');
        if (localStorage.getItem('cartwheel_hw4_dirty') === '1' && Array.isArray(backup) && backup.length > state.annotations.length) { state.annotations = backup; showToast('restored unsaved notes from this browser'); scheduleSave(); }
        else localStorage.removeItem('cartwheel_hw4_dirty'); } catch {}
  try { const sp = await api.get('/ui/spotlight.json'); state.spotlight = sp && sp.traces && Object.keys(sp.traces).length ? sp : null; } catch { state.spotlight = null; }
  computeP90();
  readHash();
  render();
  armSeen();                  // the first trace counts too
  setInterval(poll, 5000);
}
function computeP90() {
  const q = (arr) => { const a = arr.filter(Number.isFinite).sort((x, y) => x - y); return a.length ? a[Math.min(a.length - 1, Math.floor(a.length * 0.9))] : Infinity; };
  const src = state.index.length ? state.index : state.samples.map(s => ({ tools: (s.features || {}).tool_call_count, reply_chars: (s.features || {}).reply_chars }));
  state.p90 = { tools: q(src.map(r => r.tools)), reply: q(src.map(r => r.reply_chars)) };
}
async function poll() {
  try {
    const [samples, patterns, suggestions, manifest, judges] = await Promise.all(['/api/samples', '/api/patterns', '/api/suggestions', '/api/manifest', '/api/judges'].map(api.get));
    const changes = [];
    if (Array.isArray(judges) && JSON.stringify(judges) !== JSON.stringify(state.judges)) { state.judges = judges; changes.push('judge results updated'); }
    /* A new batch arrives with its manifest entry (label_focus drives the labels card and the tracker colours), so refresh it alongside the samples. */
    if (manifest && typeof manifest === 'object' && JSON.stringify(manifest) !== JSON.stringify(state.manifest)) { state.manifest = manifest; if (!changes.length && JSON.stringify(samples) === state.snap.samples) changes.push('batches updated'); }
    if (JSON.stringify(samples) !== state.snap.samples) { const before = state.samples.length; state.samples = Array.isArray(samples) ? samples : []; state.snap.samples = JSON.stringify(samples); changes.push(`${state.samples.length - before} new trace(s) in the sample`); }
    if (JSON.stringify(patterns) !== state.snap.patterns) { state.patterns = patterns && Array.isArray(patterns.modes) ? patterns : { modes: [] }; state.snap.patterns = JSON.stringify(patterns); changes.push('taxonomy updated'); }
    if (JSON.stringify(suggestions) !== state.snap.suggestions) { const before = pendingAll().length; state.suggestions = Array.isArray(suggestions) ? suggestions : []; state.snap.suggestions = JSON.stringify(suggestions); const d = pendingAll().length - before; if (d > 0) changes.push(`${d} new suggestion(s)`); else changes.push('suggestions updated'); }
    if (!changes.length) return;
    showToast(changes.join(' · '));
    const typing = ['TEXTAREA', 'INPUT'].includes(document.activeElement.tagName);
    if (!typing) render(); else { renderDots(); setStatus(); }
  } catch {}
}
let toastTimer = null;
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', 4000); }

const sidOf = (s) => (s.meta && s.meta.scenario_id) || s.trace_id;
function codeFor(s) {
  const sid = sidOf(s);
  let a = state.annotations.find(x => x.kind === 'open_code' && (x.trace_id === s.trace_id || x.scenario_id === sid));
  if (!a) { a = { id: 'oc-' + sid, kind: 'open_code', trace_id: s.trace_id, session_id: s.session_id || null, scenario_id: sid, batch: s.batch || null, no_failure: false, scenario_issue: false, scenario_issue_note: '', ts: null, author: 'human' }; state.annotations.push(a); }
  return a;
}
const openCode = (s) => state.annotations.find(x => x.kind === 'open_code' && (x.trace_id === s.trace_id || x.scenario_id === sidOf(s)));
const inlineFor = (s) => state.annotations.filter(x => x.kind === 'inline' && (x.trace_id === s.trace_id || x.scenario_id === sidOf(s)));
const noted = (s) => inlineFor(s).some(n => n.note && n.note.trim());
const reviewed = (s) => { const a = openCode(s); const f = labelFocus(s); return !!((a && a.no_failure) || noted(s) || (f && labelOf(f, s) !== null)); };
const suggFor = (s) => state.suggestions.filter(x => x.trace_id === s.trace_id || (x.scenario_id && x.scenario_id === sidOf(s)));
const pendingFor = (s) => suggFor(s).filter(x => !x.status || x.status === 'pending');
const pendingAll = () => state.suggestions.filter(x => !x.status || x.status === 'pending');
const finalModes = () => (state.patterns.modes || []).filter(m => m.status === 'final');
/* A batch picked for one mode (select_batch --label-focus) shows only that mode's row; every other batch shows all final modes. */
const labelFocus = (s) => { const b = (state.manifest.batches || []).find(x => x.batch === s.batch); return (b && b.label_focus) || null; };
const stripModes = (s) => { const f = labelFocus(s); return f ? finalModes().filter(m => m.name === f) : finalModes(); };
const labelOf = (mode, s) => { const rec = (state.labels[mode] || {})[s.trace_id]; return rec ? rec.label : null; };
const sampleByTrace = (tid) => state.samples.findIndex(s => s.trace_id === tid || sidOf(s) === tid);
function scheduleSave() { state.dirty = true; try { localStorage.setItem('cartwheel_hw4_dirty', '1'); } catch {} setStatus(); clearTimeout(state.saveTimer); state.saveTimer = setTimeout(save, 500); }
/* Visiting a trace creates an in-memory open_code placeholder; only records with content are persisted. */
const hasContent = (a) => a.kind !== 'open_code' || !!(a.no_failure || a.scenario_issue || a.seen || (a.scenario_issue_note && a.scenario_issue_note.trim()));
async function save() {
  const records = state.annotations.filter(hasContent);
  try { localStorage.setItem('cartwheel_hw4_annotations', JSON.stringify(records)); } catch {}
  try { const r = await api.post('/api/annotations', records); state.dirty = !r || !r.ok; if (!state.dirty) localStorage.removeItem('cartwheel_hw4_dirty'); setStatus(r && r.error ? r.error : null); }
  catch (e) { state.dirty = true; setStatus('save failed: ' + e.message); }
  renderDots();
}
async function saveSuggestions() {
  try { const r = await api.post('/api/suggestions', state.suggestions); if (!r || !r.ok) setStatus('suggestion save failed'); state.snap.suggestions = JSON.stringify(state.suggestions); }
  catch (e) { setStatus('suggestion save failed: ' + e.message); }
}
/* Inline annotation on the taxonomy page: select any text inside a mode card
   and attach a note to that phrase. Stored on the mode itself as reviewer_notes,
   anchored by block offsets the same way trace notes are. */
const MODE_BLOCK = 20000;
function modeAt(block) { return (state.patterns.modes || [])[block - MODE_BLOCK] || null; }
function addModeNote(p) {
  const m = modeAt(p.block);
  if (!m) { showToast('select inside one mode card'); return hideFab(); }
  (m.reviewer_notes = m.reviewer_notes || []).push({
    id: 'mn-' + Date.now().toString(36), quote: p.quote, start: p.start, end: p.end, note: '', ts: now(),
  });
  window.getSelection().removeAllRanges(); hideFab(); schedulePatterns(); renderTaxonomy();
  const boxes = document.querySelectorAll(`.mode[data-mode="${cssq(m.name)}"] textarea.mnote`);
  const last = boxes[boxes.length - 1]; if (last) { last.focus(); last.scrollIntoView({ block: 'nearest' }); }
}
const cssq = (s) => String(s).replace(/"/g, '\\"');

/* Taxonomy review notes. The page still cannot rename, merge or split a mode;
   this writes one reviewer_note field per mode so decisions about a grouping
   live on the grouping instead of in chat. */
let patTimer = null;
function schedulePatterns() { clearTimeout(patTimer); patTimer = setTimeout(savePatterns, 600); setStatus(); }
async function savePatterns() {
  try {
    const r = await api.post('/api/patterns', state.patterns);
    if (!r || !r.ok) { setStatus('taxonomy save failed'); return; }
    state.snap.patterns = JSON.stringify(state.patterns);
    setStatus(null);
  } catch (e) { setStatus('taxonomy save failed: ' + e.message); }
}
/* Optimistic: the label lands in state and the buttons repaint on click, then the
   write happens. A Langfuse score round-trip takes a moment, and waiting for it
   before repainting makes the strip feel broken. On failure the previous value
   is restored and the reason is shown. */
function applyLabelLocally(s, mode, label, source) {
  state.labels[mode] = state.labels[mode] || {};
  if (label === null) delete state.labels[mode][s.trace_id];
  else state.labels[mode][s.trace_id] = { label, source: source || 'human', ts: now() };
}
async function setLabel(s, mode, label, extra) {
  const body = Object.assign({ trace_id: s.trace_id, mode, label, scenario_id: sidOf(s), session_id: s.session_id || null, source: 'human' }, extra || {});
  const prev = (state.labels[mode] || {})[s.trace_id];
  applyLabelLocally(s, mode, label, body.source);
  state.pendingLabels = (state.pendingLabels || 0) + 1;
  refreshStrip(s); refreshJudge(s); renderDots(); setStatus();
  try {
    const r = await api.post('/api/labels', body);
    if (!r || !r.ok) {
      applyLabelLocally(s, mode, prev ? prev.label : null, prev && prev.source);
      setStatus('label failed: ' + (r && r.error)); refreshStrip(s); return false;
    }
    const lf = String(r.langfuse || ''); if (/failed/.test(lf)) showToast(`label saved locally; Langfuse: ${lf}`);
    return true;
  } catch (e) {
    applyLabelLocally(s, mode, prev ? prev.label : null, prev && prev.source);
    setStatus('label failed: ' + e.message); refreshStrip(s); return false;
  } finally {
    state.pendingLabels = Math.max(0, (state.pendingLabels || 1) - 1);
    setStatus();
  }
}
function setStatus(err) {
  const el = document.getElementById('status');
  const n = state.samples.length, done = state.samples.filter(reviewed).length, pend = pendingAll().length;
  const lbl = state.pendingLabels || 0;
  const conf = state.samples.filter(wasSeen).length;
  el.innerHTML = err ? `<span class="saved dirty">${esc(err)}</span>` : `${done} of ${n} reviewed · seen ${conf}/${n}${pend ? ` · ${pend} suggestion${pend === 1 ? '' : 's'}` : ''} · <span class="saved ${state.dirty || lbl ? 'dirty' : 'ok'}">${state.dirty ? 'saving…' : lbl ? `writing ${lbl} label${lbl === 1 ? '' : 's'}…` : 'saved ✓'}</span>`;
}

/* ---------- navigation and views ---------- */
function readHash() {
  const m = location.hash.replace('#', '').match(/^(review|taxonomy|labels|progress)?\/?(\d+)?$/) || [];
  state.view = m[1] || 'review';
  const h = parseInt(m[2], 10); state.idx = Number.isFinite(h) && h >= 1 && h <= state.samples.length ? h - 1 : Math.min(state.idx, Math.max(0, state.samples.length - 1));
}
function writeHash() { location.hash = state.view === 'review' ? `review/${state.idx + 1}` : state.view; }
function go(i, opts) {
  if (!state.samples.length) return;
  state.idx = Math.max(0, Math.min(state.samples.length - 1, i)); state.view = 'review';
  writeHash(); render(); window.scrollTo({ top: 0 }); armSeen();

          ${c.status === 'accepted' ? '<span class="chip ok">accepted</span>' : c.status === 'rejected' ? '<span class="chip no">rejected</span>' : '<span class="cnbtns"><button class="ppyes">accept</button><button class="ppno">reject</button></span>'}
        </li>`).join('')}</ul>` : ''}
      ${(m.close_negatives || []).length ? `<div class="lbl">Close negatives · traces that look like this failure but are not</div><ul class="cnlist">${m.close_negatives.map(c => `
        <li class="cn ${esc(c.status || 'proposed')}" data-mode="${esc(m.name)}" data-cn="${esc(c.scenario_id)}">
          <span class="sid" data-t="${esc(c.scenario_id)}">${esc(c.scenario_id)}</span>
          <span class="cnwhy">${esc(c.why || '')}</span>
          ${c.status === 'accepted' ? '<span class="chip ok">accepted</span>' : c.status === 'rejected' ? '<span class="chip no">rejected</span>' : '<span class="cnbtns"><button class="cnyes">accept</button><button class="cnno">reject</button></span>'}
        </li>`).join('')}</ul>` : ''}
      <div class="lbl">Origin · human annotations this mode was drafted from</div>${origin ? `<ul>${origin}</ul>` : '<div class="meta">none recorded</div>'}
      ${(m.example_quotes || []).length ? `<div class="lbl">Example quotes</div><ul>${m.example_quotes.map(q => `<li><span class="q">“${esc(q)}”</span></li>`).join('')}</ul>` : ''}
      ${(m.revisions || []).length ? `<div class="lbl">Revisions</div><ul>${m.revisions.map(r => `<li>${esc(r.ts || '')} · ${esc(r.change || r)}</li>`).join('')}</ul>` : ''}
      ${(m.reviewer_notes || []).length ? `<div class="lbl">Your notes</div>${(m.reviewer_notes || []).map(n => `
        <div class="mnrow${n.resolved ? ' done' : ''}" data-nid="${esc(n.id)}">
          <div class="mnq">${n.resolved ? '<span class="tick">✓</span>' : ''}“${esc(n.quote || '')}”<button class="mndel" title="delete this note">×</button></div>
          ${n.response ? `<div class="mnresp">${esc(n.response)}</div>` : ''}
          <textarea class="mnote" data-mode="${esc(m.name)}" data-nid="${esc(n.id)}" rows="2" placeholder="what should change here?">${esc(n.note || '')}</textarea>
        </div>`).join('')}` : '<div class="meta mnhint">Select any text above — the definition, the boundary, an origin note — and click ＋ annotate to attach a note to that phrase.</div>'}
    </div></div>`;
  }).join('');
  main.querySelectorAll('.mode .mh').forEach(h => h.onclick = () => {
    const card = h.closest('.mode'); const name = card.dataset.mode;
    card.classList.toggle('collapsed') ? state.openModes.delete(name) : state.openModes.add(name);
  });
  const setAll = (open) => { modes.forEach(m => open ? state.openModes.add(m.name) : state.openModes.delete(m.name)); renderTaxonomy(); };
  document.getElementById('mode-expand').onclick = () => setAll(true);
  document.getElementById('mode-collapse').onclick = () => setAll(false);
  const findNote = (el) => {
    const m = (state.patterns.modes || []).find(x => x.name === el.dataset.mode);
    return [m, m && (m.reviewer_notes || []).find(n => n.id === el.dataset.nid)];
  };
  main.querySelectorAll('textarea.mnote').forEach(ta => {
    ta.addEventListener('click', (e) => e.stopPropagation());
    ta.addEventListener('input', (e) => {
      const [, n] = findNote(ta); if (!n) return;
      n.note = e.target.value; n.ts = now();
      const mk = main.querySelector(`mark[data-aid="${ta.dataset.nid}"]`); if (mk) mk.title = n.note;
      schedulePatterns();
    });
    ta.addEventListener('keydown', (e) => {   // Enter commits, Shift+Enter is a newline
      if (e.key !== 'Enter' || e.shiftKey) return;
      e.preventDefault(); ta.blur(); clearTimeout(patTimer); savePatterns();
    });
  });
  const cnSet = (li, status) => {
    const m = (state.patterns.modes || []).find(x => x.name === li.dataset.mode);
    const c = m && (m.close_negatives || []).find(y => y.scenario_id === li.dataset.cn);
    if (!c) return;
    c.status = status; c.decided_ts = now();
    schedulePatterns(); renderTaxonomy();
  };
  const ppSet = (li, status) => {
    const m = (state.patterns.modes || []).find(x => x.name === li.dataset.mode);
    const c = m && (m.pending_positives || []).find(y => y.scenario_id === li.dataset.pp);
    if (!c) return;
    c.status = status; c.decided_ts = now();
    const set = new Set(m.positive_traces || []);
    status === 'accepted' ? set.add(c.scenario_id) : set.delete(c.scenario_id);
    m.positive_traces = [...set].sort();
    schedulePatterns(); renderTaxonomy();
  };
  main.querySelectorAll('.ppyes').forEach(b => b.onclick = (e) => { e.stopPropagation(); ppSet(b.closest('.cn'), 'accepted'); });
  main.querySelectorAll('.ppno').forEach(b => b.onclick = (e) => { e.stopPropagation(); ppSet(b.closest('.cn'), 'rejected'); });
  main.querySelectorAll('.cnyes').forEach(b => b.onclick = (e) => { e.stopPropagation(); cnSet(b.closest('.cn'), 'accepted'); });
  main.querySelectorAll('.cnno').forEach(b => b.onclick = (e) => { e.stopPropagation(); cnSet(b.closest('.cn'), 'rejected'); });
  main.querySelectorAll('.mndel').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    const row = b.closest('.mnrow'); const ta = row.querySelector('textarea.mnote');
    const [m] = findNote(ta); if (!m) return;
    m.reviewer_notes = (m.reviewer_notes || []).filter(n => n.id !== ta.dataset.nid);
    schedulePatterns(); renderTaxonomy();
  });
  // highlight each quoted phrase inside its own mode card
  modes.forEach((m, i) => {
    const body = main.querySelector(`.mode[data-mode="${cssq(m.name)}"] .mb`);
    (m.reviewer_notes || []).forEach(n => wrapInBlock(body, n.start, n.end, 'mn', n.id, n.note || ''));
  });
  main.querySelectorAll('.sid[data-t]').forEach(el => el.onclick = (e) => { e.stopPropagation(); goTrace(el.dataset.t); });
}

/* ---------- labels view ---------- */
function renderLabels() {
  const main = document.getElementById('main'); main.className = 'page';
  const modes = finalModes();
  if (!modes.length) { main.innerHTML = `<div class="empty">No final modes yet. Structured labeling starts once the taxonomy stabilizes and modes are marked final.</div>`; return; }
  const rows = state.samples.map((s, i) => `<tr class="${reviewed(s) ? '' : 'unreviewed'}${wasSeen(s) ? ' lreviewed' : ''}" data-i="${i}"><td class="sid" title="open">${esc(sidOf(s))}</td><td>${esc(s.batch || '')}</td><td>${reviewed(s) ? (openCode(s) && openCode(s).no_failure ? 'no failure' : 'noted') : '—'}</td>${modes.map((m, j) => { const l = labelOf(m.name, s); return `<td class="cell${state.cursor.row === i && state.cursor.col === j ? ' cursor' : ''}" data-i="${i}" data-j="${j}"><span class="${l === 1 ? 'present' : l === 0 ? 'absent' : ''}">${l === 1 ? '1' : l === 0 ? '0' : '·'}</span></td>`; }).join('')}</tr>`).join('');
  const foot = modes.map(m => { const c = modeCounts(m); const decided = c.present + c.absent; return `<td>${c.present} present (${pct(c.present, decided)}) · ${c.absent} absent · ${state.samples.filter(reviewed).length - decided} undecided</td>`; }).join('');
  main.innerHTML = `<h2>Structured labels · one present/absent per reviewed trace and final mode</h2>
    <div class="hint" style="margin:0 0 10px">Click a cell to cycle undecided → present → absent → undecided. Keyboard: arrows move, <kbd>1</kbd> present, <kbd>0</kbd> absent, <kbd>⌫</kbd> clear, <kbd>Enter</kbd> opens the trace. Unreviewed traces are greyed; label them after open coding.</div>
    <table class="grid"><thead><tr><th>trace</th><th>batch</th><th>open code</th>${modes.map(m => `<th class="m" title="${esc(m.definition || '')}">${esc(m.name)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody><tfoot><tr><td colspan="3">sample fractions (of decided)</td>${foot}</tr></tfoot></table>`;
  main.querySelectorAll('td.sid').forEach(td => td.onclick = () => go(parseInt(td.parentElement.dataset.i, 10)));
  main.querySelectorAll('td.cell').forEach(td => td.onclick = () => { state.cursor = { row: parseInt(td.dataset.i, 10), col: parseInt(td.dataset.j, 10) }; cycleCell(); });
}
async function cycleCell(force) {
  const s = state.samples[state.cursor.row]; const m = finalModes()[state.cursor.col]; if (!s || !m) return;
  const cur = labelOf(m.name, s); const next = force !== undefined ? force : cur === null ? 1 : cur === 1 ? 0 : null;
  if (next === cur) return;
  if (await setLabel(s, m.name, next)) renderLabels();
}
function gridKey(e) {
  const nRows = state.samples.length, nCols = finalModes().length; if (!nRows || !nCols) return false;
  const c = state.cursor; let handled = true;
  if (e.key === 'ArrowDown') c.row = Math.min(nRows - 1, c.row + 1); else if (e.key === 'ArrowUp') c.row = Math.max(0, c.row - 1);
  else if (e.key === 'ArrowRight') c.col = Math.min(nCols - 1, c.col + 1); else if (e.key === 'ArrowLeft') c.col = Math.max(0, c.col - 1);
  else if (e.key === '1') { cycleCell(1); return true; } else if (e.key === '0') { cycleCell(0); return true; }
  else if (e.key === 'Backspace' || e.key === 'Delete') { cycleCell(null); return true; }
  else if (e.key === 'Enter') { go(c.row); return true; } else handled = false;
  if (handled) { e.preventDefault(); renderLabels(); const el = document.querySelector('td.cell.cursor'); if (el) el.scrollIntoView({ block: 'nearest' }); }
  return handled;
}

/* ---------- progress view ---------- */
function renderProgress() {
  const main = document.getElementById('main'); main.className = 'page';
  const batches = []; const seen = new Set();
  for (const s of state.samples) { const b = s.batch || '(no batch)'; if (!seen.has(b)) { seen.add(b); batches.push(b); } }
  const bySample = (b) => state.samples.filter(s => (s.batch || '(no batch)') === b);
  const rv = state.samples.filter(reviewed);
  const modes = state.patterns.modes || []; const fm = finalModes();
  const pend = pendingAll();
  const accepted = state.suggestions.filter(x => x.status === 'accepted').length, dismissed = state.suggestions.filter(x => x.status === 'dismissed').length;
  const cells = rv.reduce((n, s) => n + stripModes(s).length, 0); let decided = 0; const incomplete = [];
  for (const s of rv) { const sm = stripModes(s); let n = 0; for (const m of sm) if (labelOf(m.name, s) !== null) n++; decided += n; if (n < sm.length) incomplete.push(s); }
  const store = state.index.length || state.samples.length;
  const sidLink = (s) => `<span class="sid" data-t="${esc(s.trace_id)}">${esc(sidOf(s))}</span>`;

  /* summary tiles */
  const stats = `<div class="stats">
    <div class="stat"><div class="n">${rv.length} <span class="of">/ ${state.samples.length}</span></div><div class="l">reviewed of sampled</div><div class="s">${store} conversations in the store · ${pct(state.samples.length, store)} sampled</div></div>
    <div class="stat"><div class="n">${pend.length}</div><div class="l">suggestions to decide</div><div class="s">${accepted} accepted · ${dismissed} dismissed</div></div>
    <div class="stat link" data-view="taxonomy" title="open the taxonomy"><div class="n">${modes.length}</div><div class="l">modes in the taxonomy</div><div class="s">${fm.length} final · ${modes.length - fm.length} candidate</div></div>
    <div class="stat link" data-view="labels" title="open the labels grid"><div class="n">${fm.length ? `${decided} <span class="of">/ ${cells}</span>` : '—'}</div><div class="l">label cells decided</div><div class="s">${!fm.length ? 'no final modes yet' : !rv.length ? 'no reviewed traces yet' : `${incomplete.length} reviewed trace${incomplete.length === 1 ? '' : 's'} incomplete`}</div></div>
  </div>`;

  /* batches */
  const batchRows = batches.map(b => { const ss = bySample(b); const r = ss.filter(reviewed); const fail = r.filter(s => !(openCode(s) && openCode(s).no_failure)).length, pass = r.filter(s => openCode(s) && openCode(s).no_failure).length, issue = ss.filter(s => openCode(s) && openCode(s).scenario_issue).length, pn = ss.reduce((n, s) => n + pendingFor(s).length, 0);
    return `<tr><td>${esc(b)}</td><td class="n">${ss.length}</td><td class="n">${r.length}</td><td class="w"><div class="bar" style="min-width:80px"><i style="width:${pct(r.length, ss.length)}"></i></div></td><td class="n">${fail}</td><td class="n">${pass}</td><td class="n">${issue}</td><td class="n">${pn}</td></tr>`; }).join('');
  const batchesCard = `<div class="card"><h2>Batches <span class="sub">· ${batches.length} of the handout's four</span></h2><div class="body flush">
    ${batches.length ? `<table class="plain"><thead><tr><th>batch</th><th>picked</th><th>reviewed</th><th class="w"></th><th title="reviewed traces with a failure noted">failures</th><th title="reviewed traces marked no failure observed">clean</th><th title="scenario issue flagged">issues</th><th title="pending suggestions on this batch's traces">pending</th></tr></thead><tbody>${batchRows}</tbody></table>` : '<div class="meta" style="padding:10px 12px">No batches yet. Pick the first one with <code>select_batch</code>.</div>'}
    <div class="foot">A trace counts as reviewed once it has an open code with text or the no-failure mark. Each trace belongs to exactly one batch.</div></div></div>`;

  /* suggestion queue */
  const queue = pend.map(x => `<tr><td><input type="checkbox" class="qsel" data-sid="${esc(x.id)}"></td><td><code>${esc(x.mode || '?')}</code></td><td><span class="sid" data-t="${esc(x.trace_id)}">${esc(x.scenario_id || x.trace_id.slice(0, 12))}</span></td><td class="q w" data-t="${esc(x.trace_id)}" data-sid="${esc(x.id)}">“${esc(String(x.quote || '').slice(0, 160))}”</td><td class="meta how">${esc(x.method || '')}</td></tr>`).join('');
  const queueCard = `<div class="card"><h2>Awaiting your decision <span class="sub">· ${pend.length} suggestion${pend.length === 1 ? '' : 's'}</span></h2><div class="body${pend.length ? ' flush' : ''}">
    ${pend.length ? `<div class="qctl"><label><input type="checkbox" id="qall"> select all</label><button id="qacc">accept selected</button><button id="qdis">dismiss selected</button><input type="text" id="qreason" placeholder="reason for the dismissals (saved on each)"></div>
      <table class="plain queue"><thead><tr><th></th><th>mode</th><th>trace</th><th>quoted text</th><th>how found</th></tr></thead><tbody>${queue}</tbody></table>
      <div class="foot">Click the quoted text to open the trace at that spot. Accepting promotes the suggestion to an open code; dismissing keeps it on record with your reason.</div>`
      : '<span class="meta">Nothing pending. Suggestions appear here when a depth search finds candidate instances of a mode; each needs an explicit accept or dismiss.</span>'}</div></div>`;

  /* coverage cards */
  const valueOf = (s, field) => field === 'role' ? (s.meta || {}).role : field === 'group' ? s.scenario_group : field === 'dq' ? s.data_quality_case_id : (s.scenario || {})[field];
  const dimCard = (field, label) => {
    const vals = [...new Set([...state.index.map(r => r[field]), ...state.samples.map(s => valueOf(s, field))])].filter(v => v != null).map(String).sort();
    const rows = vals.map(v => { const st = state.index.filter(r => String(r[field]) === v).length; const sa = state.samples.filter(s => String(valueOf(s, field)) === v); const r = sa.filter(reviewed).length;
      return `<tr><td>${esc(v)}</td><td class="n">${st}</td><td class="n">${sa.length}</td><td class="n">${r}</td><td class="w"><div class="bar2" title="${esc(`${sa.length} sampled, ${r} reviewed, of ${st}`)}"><i class="sa" style="width:${pct(sa.length, st)}"></i><i class="rv" style="width:${pct(r, st)}"></i></div></td></tr>`; }).join('');
    return `<div class="card"><h2>${esc(label)}</h2><div class="body flush"><table class="plain"><thead><tr><th>value</th><th>store</th><th>sampled</th><th>reviewed</th><th class="w"></th></tr></thead><tbody>${rows || '<tr><td colspan="5" class="meta">none</td></tr>'}</tbody></table></div></div>`;
  };
  const coverage = `<h2>Coverage · store vs sampled vs reviewed <span class="meta" style="text-transform:none;letter-spacing:0;font-weight:400">· grey = sampled, green = reviewed, as a share of the store</span></h2>
    <div class="grid2"><div class="stack">${dimCard('role', 'Role')}${dimCard('group', 'Scenario group')}${dimCard('dq', 'Damaged record')}</div>${dimCard('intent', 'Intent')}</div>`;

  /* taxonomy discovery and label completeness */
  const firstBatch = (m) => { const bs = (m.created_from || []).map(id => { const a = annById(id); const s = a && state.samples[sampleByTrace(a.trace_id)]; return s ? (s.batch || '(no batch)') : null; }).filter(Boolean); return bs.length ? bs.map(b => batches.indexOf(b)).reduce((a, b) => Math.min(a, b), Infinity) : Infinity; };
  const newModes = batches.map((b, i) => { const ms = modes.filter(m => firstBatch(m) === i); return `<tr><td>${esc(b)}</td><td class="n">${ms.length}</td><td>${ms.map(m => `<code>${esc(m.name)}</code>`).join(' ') || '—'}</td></tr>`; }).join('');
  const unplaced = modes.filter(m => firstBatch(m) === Infinity);
  const discoveryCard = `<div class="card"><h2>Taxonomy discovery <span class="sub">· modes first drafted from each batch</span></h2><div class="body flush">
    ${batches.length ? `<table class="plain"><thead><tr><th>batch</th><th>new modes</th><th></th></tr></thead><tbody>${newModes}</tbody></table>` : '<div class="meta" style="padding:10px 12px">no batches yet</div>'}
    <div class="foot">${modes.length} mode${modes.length === 1 ? '' : 's'} · ${fm.length} final${unplaced.length ? ` · ${unplaced.length} with no origin note yet: ${unplaced.map(m => `<code>${esc(m.name)}</code>`).join(' ')}` : ''}. The handout asks how many new consequential modes the final 15 traces produced; a batch with zero is the saturation signal.</div></div></div>`;
  const labelsCard = `<div class="card"><h2>Structured labels <span class="sub">· ${fm.length} final mode${fm.length === 1 ? '' : 's'} × ${rv.length} reviewed trace${rv.length === 1 ? '' : 's'}</span></h2><div class="body">
    ${fm.length && !rv.length ? '<span class="meta">No reviewed traces yet; cells appear as traces are reviewed.</span>' : fm.length ? `<div>${decided} of ${cells} cells decided (${pct(decided, cells)})</div>
      <div class="meta" style="margin-top:6px">${incomplete.length ? `${incomplete.length} incomplete: ${incomplete.slice(0, 40).map(sidLink).join(', ')}${incomplete.length > 40 ? ', …' : ''}` : 'every reviewed trace is fully labeled'}</div>
      <div class="hint">Open the <a href="#labels">labels grid</a> to fill cells in bulk.</div>` : '<span class="meta">Labeling starts once a mode is marked final in the taxonomy. Until then, open coding is the whole job.</span>'}</div></div>`;

  main.innerHTML = stats + `<div class="grid2">${batchesCard}${queueCard}</div>` + coverage + `<div class="grid2">${discoveryCard}${labelsCard}</div>`;
  main.querySelectorAll('.stat.link').forEach(el => el.onclick = () => setView(el.dataset.view));
  main.querySelectorAll('.sid[data-t]').forEach(el => el.onclick = () => goTrace(el.dataset.t));
  main.querySelectorAll('td.q').forEach(el => el.onclick = () => goTrace(el.dataset.t, { focus: el.dataset.sid }));
  const qall = document.getElementById('qall'); if (qall) qall.onchange = () => main.querySelectorAll('.qsel').forEach(c => c.checked = qall.checked);
  const sel = () => [...main.querySelectorAll('.qsel:checked')].map(c => state.suggestions.find(x => x.id === c.dataset.sid)).filter(Boolean);
  const qacc = document.getElementById('qacc'); if (qacc) qacc.onclick = async () => { const xs = sel(); if (!xs.length) return; for (const x of xs) { const s = state.samples[sampleByTrace(x.trace_id)]; if (!s) { showToast(`skipped ${x.id}: trace not in the sample`); continue; } x.status = 'accepted'; x.decided_ts = now(); state.annotations.push({ id: `inline-${sidOf(s)}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`, kind: 'inline', trace_id: s.trace_id, session_id: s.session_id || null, scenario_id: sidOf(s), batch: s.batch || null, turn: x.turn ?? null, turn_trace_id: x.turn_trace_id ?? null, block: Number.isInteger(x.block) ? x.block : null, start: x.start ?? null, end: x.end ?? null, quote: x.quote || '', note: x.reason || '', ts: now(), author: 'human', source: 'accepted_suggestion', mode: x.mode || null, suggestion_id: x.id }); const mode = finalModes().find(m => m.name === x.mode); if (mode && labelOf(mode.name, s) !== 1) await setLabel(s, mode.name, 1, { source: 'accepted_suggestion', note: x.reason || null }); } scheduleSave(); await saveSuggestions(); renderProgress(); };
  const qdis = document.getElementById('qdis'); if (qdis) qdis.onclick = async () => { const xs = sel(); if (!xs.length) return; const reason = (document.getElementById('qreason').value || '').trim(); for (const x of xs) { x.status = 'dismissed'; x.decided_ts = now(); x.decision_note = reason; } await saveSuggestions(); renderProgress(); };
}

/* ---------- render dispatch ---------- */
function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.view === state.view));
  document.getElementById('counter').textContent = state.samples.length ? `${state.idx + 1} / ${state.samples.length}` : '0 / 0';
  document.getElementById('prev').disabled = state.idx <= 0; document.getElementById('next').disabled = state.idx >= state.samples.length - 1;
  renderDots(); setStatus(); hideFab();
  const head = document.getElementById('trace-head');
  if (state.view === 'review') return renderReview();
  head.hidden = true; head.innerHTML = '';
  if (state.view === 'taxonomy') return renderTaxonomy();
  if (state.view === 'labels') return renderLabels();
  return renderProgress();
}
load();
</script>
</body>
